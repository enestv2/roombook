# Roombook verification contract. Commands become active when the greenfield projects exist.
build: if find . -maxdepth 2 \( -name '*.sln' -o -name '*.slnx' \) | grep -q .; then dotnet build --nologo -warnaserror; else echo "build: no .NET solution yet (greenfield)"; fi
test: if find . -maxdepth 3 -name '*Tests.csproj' | grep -q .; then dotnet test --nologo; else echo "test: no .NET test project yet (greenfield)"; fi
lint: if [ -f client/package.json ]; then npm ci && npm run lint && npm run typecheck; else echo "lint: no React client yet (greenfield)"; fi
